<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>if(/\.pages\.dev$/.test(location.hostname)){location.replace("{{domain}}"+location.pathname+location.search+location.hash)}</script>
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:type" content="website">
<meta name="robots" content="{{robots}}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/logo-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b7a5a">
<link rel="stylesheet" href="/assets/shell.css?v={{shellv}}">
{{head_extra}}
<script>if("serviceWorker" in navigator){addEventListener("load",function(){navigator.serviceWorker.register("/sw.js").catch(function(){})})}</script>
</head>
<body class="{{body_class}}">
<header class="site-header"><div class="wrap">
  <a class="brand" href="/"><span class="dot"></span>{{brand}}</a>
  <nav class="nav"><a href="/#tools">Tools</a><a href="/about/">Why free</a><a href="{{github}}" rel="noopener">Source</a></nav>
</div></header>
{{main}}
<footer class="site-footer"><div class="wrap">
  <span>{{brand}} · open source, MIT · nothing you type is uploaded</span>
  <span><a href="{{github}}" rel="noopener">GitHub</a> · <a href="/about/">Why these are free</a> · <a href="/privacy/">Privacy</a> · <a href="/terms/">Terms</a></span>
</div></footer>
{{analytics}}
</body>
</html>
