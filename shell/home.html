<main class="wrap">
  <section class="hero">
    <h1>{{brand}}</h1>
    <p>{{tagline}}</p>
    <p class="muted" style="font-size:.95rem">Each tool replaces something that puts a paywall on the one thing you came to do. These do that thing, for free, on your own machine.</p>
  </section>
  <section id="tools">
    <h2>Tools</h2>
    <div class="grid">{{live_cards}}</div>
  </section>
  <section style="margin-top:40px">
    <h2>Coming next</h2>
    <p class="muted">Built in the order people ask for them.</p>
    <div class="grid">{{queued_cards}}</div>
  </section>
</main>
